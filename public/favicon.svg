<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kevin">
  <!--
    Kevin favicon — navy tile, white K, accent period.

    NOTE: the CLAUDE.md rule on the wordmark says a K-monogram "was explored and
    rejected". The owner overrode that on 2026-09-09 and asked for a K, so this
    is a deliberate exception to a locked rule rather than an oversight. If the
    rule still holds elsewhere, update CLAUDE.md so the two stop disagreeing.

    The period is kept from the wordmark ("Kevin." with an accent full stop) so
    the mark reads as a compression of the logo rather than a bare initial.

    Geometry is stroked rather than outlined so the weight stays even at 16px,
    and the colours are the kevin.css tokens converted from OKLCH:
    the k-accent token, oklch(0.38 0.085 252) = #1c446e. Hex, not oklch(), because
    browser chrome renders favicons outside the page's colour context.

    Replaces a purple gradient bolt (#863bff) left over from the scaffold.
  -->
  <rect width="64" height="64" rx="14" fill="#1c446e"/>
  <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="square" fill="none">
    <path d="M19 17 V47"/>
    <path d="M19 34.5 L34 17"/>
    <path d="M19 31.5 L35 47"/>
  </g>
  <circle cx="46.5" cy="43.5" r="4" fill="#ffffff"/>
</svg>
