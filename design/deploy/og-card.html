<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.card{width:1200px;height:630px;background:oklch(0.28 0.06 255);position:relative;overflow:hidden;font-family:'Lato',sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 96px;box-sizing:border-box}
.card::after{content:'';position:absolute;right:-180px;top:-180px;width:560px;height:560px;border-radius:50%;background:oklch(0.66 0.13 175 / 0.14)}
.wm{font-family:'Merriweather',serif;font-size:44px;color:#fff;font-weight:700;letter-spacing:-0.01em}
.wm span{color:oklch(0.72 0.13 175)}
.h{font-family:'Merriweather',serif;font-weight:400;font-size:82px;line-height:1.08;color:#fff;letter-spacing:-0.025em;margin:36px 0 28px;max-width:900px}
.s{font-size:28px;color:oklch(0.85 0.02 255);max-width:760px;line-height:1.4}
.tile{width:512px;height:512px;background:oklch(0.28 0.06 255);border-radius:96px;display:grid;place-items:center;position:absolute;left:0;top:700px}
.tile .k{font-family:'Merriweather',serif;font-size:300px;font-weight:700;color:#fff;letter-spacing:-0.02em}
.tile .k span{color:oklch(0.72 0.13 175)}
</style></head>
<body>
<div class="card" id="og">
  <div class="wm">Kevin<span>.</span></div>
  <div class="h">Photos in.<br>Inventory out.</div>
  <div class="s">Claim photos become a defensible, Xactimate-ready contents inventory — identified, priced from live comps, reviewed by you.</div>
</div>
<div class="tile" id="icon"><div class="k">K<span>.</span></div></div>
</body></html>
