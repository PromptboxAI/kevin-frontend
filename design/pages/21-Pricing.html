  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What counts as a claim?","acceptedAnswer":{"@type":"Answer","text":"One loss event — one insured, one date of loss, one address. On Pro it doesn't matter: claims are unlimited, so run as many as you need."}},{"@type":"Question","name":"Do I pay extra for photos or items?","acceptedAnswer":{"@type":"Answer","text":"No. Pro includes unlimited photos and items on every claim, with 500 GB of active photo storage on the account — no per-claim caps."}},{"@type":"Question","name":"Is the AI included, or is it extra?","acceptedAnswer":{"@type":"Answer","text":"Included — all of it. Vision identification, live retail comps, depreciation, and every future model improvement ship inside the flat price. No add-ons, no tier upgrades, no per-item AI fees."}},{"@type":"Question","name":"What about the free first claim?","acceptedAnswer":{"@type":"Answer","text":"Every new account gets one full claim free. Run a real loss through Kevin end-to-end before you pay anything."}},{"@type":"Question","name":"Does this work for estate sales?","acceptedAnswer":{"@type":"Answer","text":"Yes. Pro includes estate sale mode — catalog a whole home, track condition and disposition, and export a clean inventory PDF. Same flat price."}},{"@type":"Question","name":"Can I cancel anytime?","acceptedAnswer":{"@type":"Answer","text":"Yes. Pro is month-to-month, cancel whenever. No annual lock-in unless you want one (we discount it)."}},{"@type":"Question","name":"Are pricing comps included or extra?","acceptedAnswer":{"@type":"Answer","text":"Included. Every RCV cell gets top-3 retailer comps. We don't charge per comp or per refresh."}},{"@type":"Question","name":"Who owns my data — and how long do you keep it?","acceptedAnswer":{"@type":"Answer","text":"You do, and forever. Claims get audited years after they settle, so nothing is ever deleted — closed claims move to slower archived storage but stay fully accessible, and you can export everything at any time."}},{"@type":"Question","name":"Is “unlimited claims” really unlimited?","acceptedAnswer":{"@type":"Answer","text":"Yes. No claim caps, no per-claim fees. The one metered thing is photo storage (500 GB included — real cost, generous pool); going over triggers an email, never a mid-claim lockout."}}]}</script>
