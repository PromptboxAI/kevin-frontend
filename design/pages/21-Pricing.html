  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Do I need a credit card to start the trial?","acceptedAnswer":{"@type":"Answer","text":"Yes. We verify your card at signup, but you're not charged during the 7-day trial."}},{"@type":"Question","name":"What does the 7-day free trial include?","acceptedAnswer":{"@type":"Answer","text":"Everything in Pro — real claims, full exports, live comps. Run an actual loss through Kevin end-to-end before your subscription starts."}},{"@type":"Question","name":"What happens when the trial ends?","acceptedAnswer":{"@type":"Answer","text":"Your Pro subscription starts automatically and your card is charged $249. We email you at signup and again 3 days before, so it's never a surprise."}},{"@type":"Question","name":"Am I locked in? Can I cancel?","acceptedAnswer":{"@type":"Answer","text":"No contract, month to month. Cancel in one click in Settings → Billing — before your charge date and you're never charged at all; after it, you keep access through the period you've paid for. No cancellation fee, no notice period, no phone call."}},{"@type":"Question","name":"Do I lose my work if I cancel?","acceptedAnswer":{"@type":"Answer","text":"No. Your claims, worksheets and exports stay available to download."}},{"@type":"Question","name":"Is “unlimited claims” really unlimited?","acceptedAnswer":{"@type":"Answer","text":"Yes — run as many claims as you like, with no per-claim fee. What is metered is line items: 2,000 a month are included, and past that it is $0.20 an item. A 60-photo kitchen fire is about 57 items, so 2,000 is roughly 35 claims of that size in a month."}},{"@type":"Question","name":"What counts as a claim?","acceptedAnswer":{"@type":"Answer","text":"One loss event — one insured, one date of loss, one address. On Pro it doesn't matter: claims are unlimited, so run as many as you need."}},{"@type":"Question","name":"Do I pay extra for photos or items?","acceptedAnswer":{"@type":"Answer","text":"Photos, no — upload as many as you like, with 500 GB of active storage on the account. Items, only past the 2,000 a month included, and then $0.20 each. The count is in Settings → Billing before it costs anything, and going over never locks a claim."}},{"@type":"Question","name":"Are pricing comps included or extra?","acceptedAnswer":{"@type":"Answer","text":"Included. Every RCV cell gets top-3 retailer comps. We don't charge per comp or per refresh."}},{"@type":"Question","name":"Is the AI included, or is it extra?","acceptedAnswer":{"@type":"Answer","text":"Included — all of it. Vision identification, live retail comps, depreciation, and every future model improvement ship inside the price. No add-ons and no tier upgrades; the AI is never billed separately from your item allowance."}},{"@type":"Question","name":"Who owns my data — and how long do you keep it?","acceptedAnswer":{"@type":"Answer","text":"You do, and forever. Claims get audited years after they settle, so nothing is ever deleted — closed claims move to slower archived storage but stay fully accessible, and you can export everything at any time."}},{"@type":"Question","name":"Does this work for estate sales?","acceptedAnswer":{"@type":"Answer","text":"Yes, but it is priced separately. Estate sales are $249 per estate — one price for the whole job, billed per engagement rather than per month, because an estate runs hundreds to thousands of items. Estate mode catalogs a whole home, tracks condition and disposition, and exports a client-ready PDF."}}]}</script>
