<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevin.co — Estate inventory PDF</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    doc-page:not(:defined){visibility:hidden}
    :root{
      --pdf-ink:#1a1d21; --pdf-muted:#6b7280; --pdf-line:#e3e6ea;
      --pdf-accent:#2E4B6F; /* business brand colour — Settings → Business */ --pdf-bg:#f4f5f7;
      --pdf-ui:'Lato',system-ui,sans-serif; --pdf-mono:'Geist Mono',monospace; --pdf-serif:'Merriweather',Georgia,serif;
    }
    html,body{margin:0;background:var(--pdf-bg)}
    doc-page{font-family:var(--pdf-ui);color:var(--pdf-ink);font-size:9pt;line-height:1.45}
    a{color:var(--pdf-accent)}a:hover{color:var(--pdf-accent)}
    .pdf-rh{display:flex;justify-content:space-between;align-items:center;font-size:8pt;color:var(--pdf-muted);border-bottom:1px solid var(--pdf-line);padding-bottom:6px;width:100%}
    .pdf-rh-brand{font-family:var(--pdf-serif);font-size:12pt;color:var(--pdf-ink);letter-spacing:-0.01em}
    .pdf-rh-meta{font-family:var(--pdf-mono);font-size:7.5pt;letter-spacing:0.02em}
    .pdf-rf{display:flex;justify-content:space-between;align-items:center;font-size:7.5pt;color:var(--pdf-muted);border-top:1px solid var(--pdf-line);padding-top:6px;width:100%}
    .pdf-cover{margin:36px 0 26px}
    .pdf-eyebrow{font-family:var(--pdf-mono);font-size:8pt;letter-spacing:0.14em;text-transform:uppercase;color:var(--pdf-accent);font-weight:500}
    .pdf-title{font-family:var(--pdf-serif);font-size:28pt;font-weight:400;letter-spacing:-0.01em;margin:6px 0 2px;line-height:1.05}
    .pdf-sub{font-size:10.5pt;color:var(--pdf-muted);margin-bottom:22px}
    .pdf-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;padding:16px 0;border-top:1px solid var(--pdf-line);border-bottom:1px solid var(--pdf-line)}
    .pdf-meta-l{font-size:7.5pt;text-transform:uppercase;letter-spacing:0.06em;color:var(--pdf-muted);font-weight:600;margin-bottom:3px}
    .pdf-meta-v{font-size:9.5pt;color:var(--pdf-ink)}
    .pdf-totals{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--pdf-line);border:1px solid var(--pdf-line);border-radius:8px;overflow:hidden;margin-top:20px}
    .pdf-tot{background:#fff;padding:12px 14px}
    .pdf-tot--big{background:oklch(0.45 0.13 255 / 0.06)}
    .pdf-tot-l{font-size:7.5pt;text-transform:uppercase;letter-spacing:0.05em;color:var(--pdf-muted);font-weight:600;margin-bottom:5px}
    .pdf-tot-v{font-family:var(--pdf-mono);font-size:12.5pt;font-weight:500;letter-spacing:-0.02em}
    .pdf-tot--big .pdf-tot-v{color:var(--pdf-accent)}
    .pdf-note{font-size:8pt;color:var(--pdf-muted);line-height:1.5;margin-top:12px}
    .pdf-h2{font-family:var(--pdf-serif);font-size:15pt;font-weight:400;margin:6px 0 10px}
    .pdf-table{width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed}
    .pdf-table thead th{text-align:left;font-size:7pt;text-transform:uppercase;letter-spacing:0.05em;color:var(--pdf-muted);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--pdf-ink)}
    .pdf-table tbody td{padding:5px 6px;border-bottom:1px solid var(--pdf-line);vertical-align:top}
    .pdf-table tbody tr{break-inside:avoid}
    .pdf-mono{font-family:var(--pdf-mono);font-feature-settings:"tnum"}
    .pdf-muted{color:var(--pdf-muted)}
    .pdf-strong{font-weight:600}
    .pdf-c-num,.pdf-c-num2{text-align:right;white-space:nowrap}
    .pdf-c-num{width:26px}
    .pdf-c-num2{width:11%;padding-left:4px;padding-right:4px}
    .pdf-c-room{width:12%}
    .pdf-c-desc{width:24%}
    .pdf-c-make{width:16%;color:var(--pdf-muted)}
    .pdf-c-cond{width:9%;color:var(--pdf-muted)}
    .pdf-c-src{width:14%;color:var(--pdf-muted);font-size:7.5pt}
    .pdf-model{font-family:var(--pdf-mono);font-size:7.5pt}
    .pdf-total-row td{padding:9px 6px;border-top:1.5px solid var(--pdf-ink);border-bottom:none;font-weight:600;font-size:7.5pt}
    .pdf-total-row .pdf-strong{color:var(--pdf-accent)}
    .pdf-certify{margin-top:22px;padding:14px 16px;background:#fff;border:1px solid var(--pdf-line);border-radius:8px;break-inside:avoid}
    .pdf-certify-t{font-size:8pt;text-transform:uppercase;letter-spacing:0.06em;color:var(--pdf-muted);font-weight:600;margin-bottom:6px}
    .pdf-certify p{margin:0;font-size:8.5pt;color:var(--pdf-ink);line-height:1.55}
    .pdf-methodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:8.5in;margin:0 auto 14px;padding:10px 14px;background:#fff;border:1px solid var(--pdf-line);border-radius:8px;font-family:Lato,sans-serif}
    .pdf-methodbar-back{font:inherit;font-size:12px;color:var(--pdf-accent);text-decoration:none;padding:4px 8px;border-radius:6px;border:1px solid var(--pdf-line)}
    .pdf-methodbar-back:hover{background:#f4f5f7}
    .pdf-methodbar-l{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:var(--pdf-muted)}
    .k-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:6px 12px;border:1px solid var(--pdf-accent);background:var(--pdf-accent);color:#fff;border-radius:6px;cursor:pointer;text-decoration:none}
    .k-btn--ghost{background:#fff;color:var(--pdf-ink);border-color:var(--pdf-line)}
    .k-btn--ghost:hover{background:#f4f5f7}
    .k-btn--sm{padding:5px 10px}
    @media print{.pdf-methodbar{display:none!important}}
  </style>
<script>/* reset scroll on page entry — cross-page links otherwise inherit the previous page's scroll position */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('load', function(){ window.scrollTo(0,0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; });
</script>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../doc-page.js"></script>
  <script type="text/babel" src="../components/data.jsx"></script>
  <script type="text/babel" src="../components/shared.jsx"></script>
  <script type="text/babel" src="../components/worksheet.jsx"></script>
  <script type="text/babel" src="../components/estate-worksheet.jsx"></script>
  <script type="text/babel" src="../components/estate-pdf.jsx"></script>
  <script type="text/babel">
    const Comp = window.EstatePdf;
    if (Comp) ReactDOM.createRoot(document.getElementById('root')).render(<Comp />);
    else document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#c00">Missing component: EstatePdf</div>';
  </script>
</body>
</html>
