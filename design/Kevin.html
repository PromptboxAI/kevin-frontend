    // ── Error boundary — one crashed artboard shouldn't blank the canvas ──
    class Boundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err, info) { console.error('[Kevin artboard crashed]', this.props.label, err, info); }
      render() {
        if (this.state.err) {
          return (
            <div style={{ width: '100%', height: '100%', display: 'grid', placeItems: 'center', background: 'oklch(0.97 0.012 25)', color: 'oklch(0.45 0.13 30)', fontFamily: 'var(--k-font-mono)', fontSize: 12, padding: 24, textAlign: 'center' }}>
              <div>
                <div style={{ fontWeight: 700, marginBottom: 6 }}>Artboard crashed</div>
                <div style={{ fontSize: 11, opacity: 0.7, maxWidth: 420 }}>{this.props.label} · {String(this.state.err && this.state.err.message)}</div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const ACCENTS = [
      'oklch(0.38 0.085 252)',   // deep navy (default)
      'oklch(0.30 0.060 252)',   // midnight (darker navy)
      'oklch(0.45 0.040 250)',   // slate (cooler / less saturated)
      'oklch(0.40 0.080 240)',   // ink blue (slightly cooler hue)
    ];

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "oklch(0.38 0.085 252)",
      "density": "comfortable"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

      // Apply accent to CSS var
      React.useEffect(() => {
        const c = tweaks.accent || ACCENTS[0];
        document.documentElement.style.setProperty('--k-accent', c);
        document.documentElement.style.setProperty('--k-accent-soft', c.replace(')', ' / 0.10)'));
      }, [tweaks.accent]);

      const { DesignCanvas, DCSection, DCArtboard } = window;
      const { Landing, Intake, PhotoStaging, Processing, Worksheet,
              ExportFlow, SignIn, Claims, CarrierSettings, MobileCapture,
              Exports, ClaimOverview, SettingsPricing, RequestAccess,
              ClaimPhotos, AuditLog, Notifications, TeamManagement, EdgeStates,
              Pricing, ForAdjusters, ForLiquidators, Docs, LegalHub,
              MobileSignIn, MobilePair, MobileReview, ShareClaim,
              SettingsProfile, SettingsAgency, SettingsExport,
              SettingsIntegrations, SettingsBilling, SettingsApi,
              ProductOverview, ContactSales, About, PricingSourceDetail,
              ChangePassword, TwoFactor, Passkeys, ActiveSessions,
              ForgotPassword, ResetSent, ResetPassword,
              SampleClaim,
              SignOut, BookCall, WatchDemo, Careers, AddItemModal, SSOSignIn } = window;

      // Simple cross-artboard navigation — finds the target artboard's DOM node
      // by data-screen-label and pans/centers the canvas on it via the DC focus
      // button if available, otherwise scrollIntoView via the parent scroll.
      window.kevinNavigate = (targetLabel) => {
        const target = document.querySelector(`[data-screen-label="${targetLabel}"]`);
        if (!target) return;
        const artboard = target.closest('[data-dc-artboard]') || target.closest('.dc-artboard') || target.parentElement;
        // Try to click an in-page focus button if present
        const focusBtn = artboard?.querySelector?.('[data-dc-focus]');
        if (focusBtn) { focusBtn.click(); return; }
        // Otherwise just center the artboard in the canvas viewport
        const canvas = document.querySelector('.dc-canvas, .dc-canvas-bg');
        const r = artboard?.getBoundingClientRect();
        const cr = canvas?.getBoundingClientRect();
        if (r && cr && canvas) {
          const sx = (canvas.scrollLeft || 0) + r.left - cr.left - (cr.width - r.width) / 2;
          const sy = (canvas.scrollTop || 0)  + r.top  - cr.top  - (cr.height - r.height) / 2;
          canvas.scrollTo?.({ left: sx, top: sy, behavior: 'smooth' });
        }

                </div>
              </DCArtboard>

              <DCArtboard id="careers" label="Careers · open roles" width={1280} height={1080}>
                <div data-screen-label="52 Careers" style={{ width: '100%', height: '100%', overflowY: 'auto' }}>
                  <Careers />
                </div>
              </DCArtboard>

              <DCArtboard id="add-item" label="Worksheet · Add item modal" width={1480} height={920}>
                <div data-screen-label="53 Add item modal" style={{ width: '100%', height: '100%' }}>
                  <AddItemModal />
                </div>
              </DCArtboard>

            </DCSection>
          </DesignCanvas>

          {/* — Tweaks — */}
          <window.TweaksPanel title="Tweaks">
            <window.TweakSection label="Theme">
              <window.TweakRadio
                label="Density"
                value={tweaks.density}
                options={[
                  { value: 'comfortable', label: 'Comfortable' },
                  { value: 'compact',     label: 'Compact'     },
                ]}
                onChange={(v) => setTweak('density', v)}
              />
              <window.TweakColor
                label="Accent"
                value={tweaks.accent}
                options={ACCENTS}
                onChange={(v) => setTweak('accent', v)}
              />
            </window.TweakSection>
          </window.TweaksPanel>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
